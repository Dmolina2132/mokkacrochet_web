version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount dev.db to persist data between container restarts
      - ./dev.db:/app/dev.db
    environment:
      - DATABASE_URL=file:./dev.db
      - NODE_ENV=production
    restart: always
